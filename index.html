<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy for XSS and resource protection (#261) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.logrocket.io https://*.stellar.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.stellar.org wss://*.stellar.org https://*.sentry.io https://*.logrocket.io https://cdn.logrocket.io http://localhost:* ws://localhost:* wss://*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <!-- Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preload critical fonts and icons to reduce LCP and eliminate CLS -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <link rel="preload" as="image" href="/vite.svg" type="image/svg+xml" />

    <!-- LogRocket Session Replay (with SRI) -->
    <!-- SRI hash auto-generated via `node scripts/generate-sri.mjs --update` -->
    <!--
      Deferred to the window `load` event (#382) instead of injected immediately:
      the script tag itself was already async/non-blocking, but creating it
      during head parsing still competed with critical-path requests (fonts, the
      app bundle) for an early connection and a slot on the network/main thread.
      Session replay coverage from page load onward is not needed for a tool
      whose job is reproducing bugs after the fact, so waiting until the page has
      finished loading has no practical effect on what LogRocket can capture.
    -->
    <script>
      // Only load LogRocket in production/staging environments
      if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        window.addEventListener('load', function () {
          var script = document.createElement('script')
          script.src = 'https://cdn.logrocket.io/LogRocket.min.js'
          script.async = true
          script.crossOrigin = 'anonymous'
          // Subresource Integrity - prevents CDN compromise attacks
          // Hash generated via `npm run sri:generate` - see scripts/generate-sri.mjs
          script.integrity = 'sha384-8Sg4qcZfgEKs89yaA8MMPQeVhXkzYIYp++A+tf+FjCYRfc6dJKwq2NPrRhP0F0A9'
          // Fallback for SRI failures (network or integrity mismatch)
          script.onerror = function () {
            console.warn('[SRI] LogRocket failed to load (integrity or network). Attempting fallback without SRI.')
            var fallback = document.createElement('script')
            fallback.src = 'https://cdn.logrocket.io/LogRocket.min.js'
            fallback.async = true
            fallback.crossOrigin = 'anonymous'
            fallback.onerror = function () {
              console.error('[SRI] LogRocket fallback also failed. Session replay disabled.')
            }
            // Report SRI failure if monitoring available
            if (window.analytics && window.analytics.track) {
              try { window.analytics.track('sri_fallback', { resource: 'logrocket' }) } catch(e) {}
            }
            document.head.appendChild(fallback)
          }
          document.head.appendChild(script)
        })
      }
    </script>
    <title>Stellar Nebula</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
