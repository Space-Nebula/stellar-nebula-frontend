<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy for XSS and resource protection (#261).
         frame-ancestors is ignored in a <meta> tag, so clickjacking protection (#487)
         is enforced by the frame-ancestors header in vercel.json and nginx.conf. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.logrocket.io https://*.stellar.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.stellar.org wss://*.stellar.org https://*.sentry.io https://*.logrocket.io https://cdn.logrocket.io http://localhost:* ws://localhost:* wss://*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <!-- Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preload critical fonts and icons to reduce LCP and eliminate CLS (#354, #379) -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/inter/v18/UcC73FwrK3iLTeHuS_fvQtMwCp50KnMa1ZL7W0Q5nw.woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <link rel="preload" as="image" href="/vite.svg" type="image/svg+xml" />

    <!-- LogRocket Session Replay - Load early for maximum coverage (with SRI) -->
    <!-- SRI hash auto-generated via `node scripts/generate-sri.mjs --update` -->
    <script>
      // Only load LogRocket in production/staging environments
      if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        ;(function () {
          var script = document.createElement('script')
          script.src = 'https://cdn.logrocket.io/LogRocket.min.js'
          script.async = true
          script.crossOrigin = 'anonymous'
          // Subresource Integrity - prevents CDN compromise attacks
          // Hash generated via `npm run sri:generate` - see scripts/generate-sri.mjs
          script.integrity = 'sha384-8Sg4qcZfgEKs89yaA8MMPQeVhXkzYIYp++A+tf+FjCYRfc6dJKwq2NPrRhP0F0A9'
          // Fail closed on SRI failures (integrity mismatch or network). Re-requesting the
          // script without its integrity hash would run an unverified copy, so session
          // replay is disabled instead.
          script.onerror = function () {
            console.error('[SRI] LogRocket failed integrity check or network load. Session replay disabled.')
            if (window.analytics && window.analytics.track) {
              try { window.analytics.track('sri_violation', { resource: 'logrocket' }) } catch(e) {}
            }
          }
          document.head.appendChild(script)
        })()
      }
    </script>
    <title>Stellar Nebula</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
