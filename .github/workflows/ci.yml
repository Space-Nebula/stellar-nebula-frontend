name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Weekly run so a newly published advisory fails `dependency-scan` (and alerts the
  # team) even when nothing is being merged.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: 20

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so the format check can diff against the PR base branch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prettier is enforced on files the PR touches. Whole-repo formatting drift is
      # handled separately (`npm run format`), so unrelated files do not fail this job.
      - name: Check formatting of changed files
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" \
            | grep -E '\.(ts|tsx|js|jsx|json|css|md)$' || true)
          if [ -z "$files" ]; then
            echo "No changed files need formatting checks."
            exit 0
          fi
          npx prettier --check $files

      # `stylish` output and `--pretty false` match the eslint/tsc problem matchers that
      # setup-node registers, so failures show up as inline annotations on the diff.
      - name: Lint
        id: lint
        run: |
          set -o pipefail
          npm run lint -- --max-warnings=0 2>&1 | tee eslint-report.txt

      - name: Type check
        id: typecheck
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npx tsc -b --noEmit --pretty false 2>&1 | tee typecheck-report.txt

      - name: Check for new unused exports
        if: ${{ !cancelled() }}
        run: npm run unused-exports:check

      - name: Check for duplicate dependencies (React/Three.js)
        if: ${{ !cancelled() }}
        run: npm run check-duplicates

      - name: Comment lint and type-check results on PR
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        # Fork PRs get a read-only token; the annotations above still apply there.
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lint-typecheck-report -->';
            const read = (file) => {
              try {
                return fs.readFileSync(file, 'utf8').replace(new RegExp(process.cwd() + '/', 'g'), '').trim();
              } catch {
                return '';
              }
            };
            const section = (title, outcome, output) => {
              const icon = outcome === 'success' ? '✅' : outcome === 'skipped' ? '⏭️' : '❌';
              const body = output ? `\n<details${outcome === 'success' ? '' : ' open'}><summary>Output</summary>\n\n\`\`\`\n${output.slice(0, 30000)}\n\`\`\`\n</details>` : '';
              return `### ${icon} ${title}: ${outcome}${body}`;
            };
            const body = [
              marker,
              '## Lint & type check',
              section('ESLint', process.env.LINT_OUTCOME, read('eslint-report.txt')),
              section('TypeScript', process.env.TYPECHECK_OUTCOME, read('typecheck-report.txt')),
            ].join('\n\n');

            // Update one comment per PR instead of adding a new one on every push.
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on any high/critical advisory in production dependencies, and on any
      # high/critical advisory in dev dependencies that is not a reviewed, unexpired
      # entry in .audit-allowlist.json. Accepted exceptions are documented there and
      # in docs/SECURITY.md; at the moment that is only `braces` (GHSA-vfj7-8cjw-p6xm),
      # reached solely through Tailwind CSS 3 at build time.
      - name: Audit npm dependencies
        run: npm run audit:ci

      - name: Audit summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## npm audit'
            echo
            echo '```'
            npm audit --audit-level=low 2>&1 | tail -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: test
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-output.txt

      - name: Report test failures to summary
        if: failure()
        run: |
          {
            echo '## ❌ Unit Test Failures'
            echo ''
            echo '```'
            tail -n 100 test-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json

  storybook-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers for Storybook
        run: npx playwright install --with-deps chromium

      - name: Run Storybook tests
        run: npm run test:storybook

      - name: Build Storybook (verifies compilation & assets)
        run: npm run build-storybook

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check image budget
        run: npm run images:check

      # Same steps as `npm run build`, split so a failure names the stage that broke.
      - name: Type check (tsc -b)
        run: npx tsc -b --pretty false

      # Fails when a CDN script's hash no longer matches index.html (#485).
      - name: Verify SRI hashes for CDN scripts
        run: npm run sri:check

      - name: Bundle (vite build)
        run: npx vite build

      - name: Verify source maps were generated
        run: |
          count=$(find dist -name '*.js.map' | wc -l)
          echo "Found $count source maps"
          if [ "$count" -eq 0 ]; then
            echo '::error::vite build produced no source maps'
            exit 1
          fi

      - name: Size Limit — budgets per chunk
        uses: andresz1/size-limit-action@v1.8.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: install

      - name: Bundle Analysis — track over time & fail on +10%
        run: node scripts/bundle-analysis.mjs
        # Fails the job if any chunk grows >10% vs baseline

      - name: Upload bundle visualization
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-analysis
          path: |
            stats.html
            stats.json
            bundle-report.json
            bundle-report.md
            .bundle-baseline.json
          if-no-files-found: warn

      - name: Comment bundle report on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = '📦 **Bundle Analysis**\n\n';
            try {
              const report = fs.readFileSync('bundle-report.md', 'utf8');
              body += report.slice(0, 60000);
              body += '\n\n*Visualization: `stats.html` in bundle-analysis artifact*';
            } catch (e) {
              body += 'No bundle report generated.';
            }
            // Only comment if report exists
            if (body.length > 50) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

      - name: Upload build artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

      - name: Upload preview build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: dist/
          if-no-files-found: error

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [lint-and-typecheck, dependency-scan, test, storybook-test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      deployments: write
      pull-requests: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: preview-dist
          path: dist/

      - name: Deploy preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-preview/${{ github.event.number }}
          keep_files: true
          publish_branch: gh-pages

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-preview/${prNumber}/`;
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployed: ${previewUrl}`
            });
