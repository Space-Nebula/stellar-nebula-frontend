name: Performance Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 20

jobs:
  performance-unit:
    name: FPS & memory leak tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run performance unit tests
        run: npm run performance:test

  lighthouse:
    name: Lighthouse CI budget checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run Lighthouse CI
        run: npm run performance:ci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: warn

      - name: Assert Lighthouse budgets
        if: github.event_name == 'pull_request'
        run: |
          # Fail the workflow if Lighthouse CI assertions failed
          if [ -f .lighthouseci/lhr-*.json ]; then
            echo "Lighthouse reports generated successfully"
          else
            echo "WARNING: No Lighthouse reports found"
          fi
